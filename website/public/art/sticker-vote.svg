<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Ballot Card Going Into Slot -->
  <g transform="rotate(-6 60 48)">
    <rect x="43" y="14" width="34" height="38" rx="3" fill="#FFFFFF" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
    <line x1="49" y1="21" x2="61" y2="21" stroke="#0B0D12" stroke-width="3" stroke-linecap="round"/>
    <line x1="49" y1="27" x2="56" y2="27" stroke="#0B0D12" stroke-width="3" stroke-linecap="round"/>
    <path d="M 51 37 L 57 42 L 70 29" fill="none" stroke="#C6F04A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Ballot Box Body -->
  <rect x="26" y="54" width="68" height="52" rx="6" fill="#2B4BDB" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ballot Box Lid -->
  <rect x="20" y="44" width="80" height="14" rx="4" fill="#FF8A3D" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
  <!-- Slot in Lid -->
  <rect x="40" y="49" width="40" height="4" rx="2" fill="#0B0D12"/>
  <!-- Front Vote Emblem -->
  <circle cx="60" cy="80" r="16" fill="#FFFFFF" stroke="#0B0D12" stroke-width="3"/>
  <path d="M 52 80 L 58 86 L 69 73" fill="none" stroke="#FF8A3D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
