  <ellipse cx="78" cy="80" rx="4" ry="2.5" fill="#FF8A3D" stroke="#0B0D12" stroke-width="3"/>
  <!-- Mischievous Smirk -->
  <path d="M 48 85 Q 60 88 72 82 Q 74 80 72 78" stroke="#0B0D12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
