<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top Loop -->
  <path d="M 44 24 C 44 10, 76 10, 76 24" fill="none" stroke="#0B0D12" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Top Push Button -->
  <rect x="55" y="20" width="10" height="9" fill="#FF8A3D" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
  <rect x="49" y="14" width="22" height="8" rx="3" fill="#FF8A3D" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
  <!-- Top-Right Lap Button -->
  <g transform="rotate(40 60 67)">
    <rect x="56" y="20" width="8" height="8" fill="#C6F04A" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
    <rect x="53" y="14" width="14" height="7" rx="2" fill="#C6F04A" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Chunky Stopwatch Case -->
  <circle cx="60" cy="67" r="41" fill="#2B4BDB" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
  <!-- Dial Face -->
  <circle cx="60" cy="67" r="31" fill="#FFFFFF" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
  <!-- Elapsed Time Pie Wedge -->
  <path d="M 60 67 L 60 36 A 31 31 0 0 1 87 52 Z" fill="#C6F04A" stroke="#0B0D12" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tick Marks -->
  <line x1="60" y1="36" x2="60" y2="42" stroke="#0B0D12" stroke-width="3" stroke-linecap="round"/>
  <line x1="91" y1="67" x2="85" y2="67" stroke="#0B0D12" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="98" x2="60" y2="92" stroke="#0B0D12" stroke-width="3" stroke-linecap="round"/>
  <line x1="29" y1="67" x2="35" y2="67" stroke="#0B0D12" stroke-width="3" stroke-linecap="round"/>
  <!-- Stopwatch Hand & Counterbalance -->
  <line x1="60" y1="67" x2="52" y2="72" stroke="#0B0D12" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="60" y1="67" x2="85" y2="52" stroke="#FF8A3D" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="60" cy="67" r="5.5" fill="#FF8A3D" stroke="#0B0D12" stroke-width="3"/>
</svg>
